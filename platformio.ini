  -DTAZPro -DLULZBOT_BLTouch -DLULZBOT_LONG_BED_V2 -DTOOLHEAD_Galaxy_Series

[env:TAZProXT_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZProXT -DTOOLHEAD_Galaxy_Series

[env:TAZProXT_Galaxy_BLTouch]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZProXT -DLULZBOT_BLTouch -DTOOLHEAD_Galaxy_Series

[env:TAZProXT_Galaxy_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZProXT -DTOOLHEAD_Galaxy_DualExtruder

[env:TAZProXT_Universal]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZProXT -DTOOLHEAD_Legacy_Universal

[env:TAZProXT_Universal_BLTouch]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZProXT -DLULZBOT_BLTouch -DTOOLHEAD_Legacy_Universal

