#
# Marlin Firmware
# PlatformIO Configuration File
#
# For detailed documentation with EXAMPLES:
#
# https://docs.platformio.org/en/latest/projectconf/index.html
#

# Automatic targets - enable auto-uploading
#targets = upload

[platformio]
src_dir      = Marlin
boards_dir   = buildroot/share/PlatformIO/boards
include_dir  = Marlin
extra_configs = ini/features.ini

default_envs = # Builds all provided environments
  # Mini 2
  Mini2_Galaxy
  Mini2_Universal

  # SideKicks
  SideKick289_Galaxy
  SideKick289_Universal

  SideKick747_Galaxy
  SideKick747_Universal

  # TAZ 8
  TAZ8_Galaxy
  TAZ8_Galaxy_Dual

  TAZ8_LongBed_Galaxy
  TAZ8_LongBed_Galaxy_Dual

  # TAZ 8 XT
  TAZ8XT_Galaxy 
  TAZ8XT_Galaxy_Dual
  
  TAZ8XT_LongBed_Galaxy
  TAZ8XT_LongBed_Galaxy_Dual

  # TAZ Pro
  TAZPro_Galaxy
  TAZPro_Galaxy_BLTouch
  TAZPro_Galaxy_Dual
  TAZPro_Universal
  TAZPro_Universal_BLTouch
  TAZPro_Universal_Dual

  TAZPro_LongBed_Galaxy
  TAZPro_LongBed_Universal

  TAZPro_LongBedv2_Galaxy

  # TAZ Pro XT
  TAZProXT_Galaxy
  TAZProXT_Galaxy_BLTouch
  TAZProXT_Galaxy_Dual
  TAZProXT_Universal
  TAZProXT_Universal_BLTouch
  TAZProXT_Universal_Dual

  TAZProXT_LongBed_Galaxy
  TAZProXT_LongBed_Universal

  TAZProXT_LongBedv2_Galaxy

  # Workhorse
  Workhorse_Galaxy
  Workhorse_Universal

  # Workhorse 2
  Workhorse2_Galaxy


#
# The 'common' section applies to most Marlin builds.
#
# By default platformio build will abort after 5 errors.
# Remove '-fmax-errors=5' from build_flags below to see all.
#
[common]
build_flags        = -g3 -D__MARLIN_FIRMWARE__ -DNDEBUG
                     -fmax-errors=5
extra_scripts      =
  pre:buildroot/share/PlatformIO/scripts/common-dependencies.py
  pre:buildroot/share/PlatformIO/scripts/common-cxxflags.py
  pre:buildroot/share/PlatformIO/scripts/preflight-checks.py
  post:buildroot/share/PlatformIO/scripts/common-dependencies-post.py
  post:buildroot/share/PlatformIO/scripts/lulzbot_rename.py
  post:buildroot/share/PlatformIO/scripts/lulzbot_config_snapshot.py
lib_deps           =
default_src_filter = +<src/*> -<src/config> -<src/tests>
  ; LCDs and Controllers
  -<src/lcd/HD44780> -<src/lcd/dogm> -<src/lcd/TFTGLCD> -<src/lcd/tft> -<src/lcd/tft_io>
  -<src/lcd/e3v2> -<src/lcd/menu> -<src/lcd/extui> -<src/lcd/touch>
  -<src/lcd/lcdprint.cpp>
  ; Marlin HAL
  -<src/HAL>
  +<src/HAL/shared>
  -<src/HAL/shared/backtrace>
  -<src/HAL/shared/cpu_exception>
  -<src/HAL/shared/eeprom_if_i2c.cpp>
  -<src/HAL/shared/eeprom_if_spi.cpp>
  ; Features and G-Codes
  -<src/feature>
  -<src/gcode/bedlevel>
  -<src/gcode/calibrate>
  -<src/gcode/config>
  -<src/gcode/control>
  -<src/gcode/feature>
  -<src/gcode/geometry>
  -<src/gcode/host>
  -<src/gcode/lcd>
  -<src/gcode/motion>
  -<src/gcode/probe>
  -<src/gcode/scara>
  -<src/gcode/sd>
  -<src/gcode/temp>
  -<src/gcode/units>
  ; Library Code
  -<src/libs/heatshrink>
  -<src/libs/BL24CXX.cpp> -<src/libs/W25Qxx.cpp>
  -<src/libs/MAX31865.cpp>
  -<src/libs/hex_print.cpp>
  -<src/libs/least_squares_fit.cpp>
  -<src/libs/nozzle.cpp>
  ; Modules
  -<src/module>
  -<src/module/stepper>
  ; Media Support
  -<src/sd>
  ;
  ; Minimal Requirements
  ;
  +<src/gcode/calibrate/G28.cpp>
  +<src/gcode/config/M200-M205.cpp>
  +<src/gcode/config/M220.cpp>
  +<src/gcode/control/M17_M18_M84.cpp>
  +<src/gcode/control/M80_M81.cpp>
  +<src/gcode/control/M85.cpp>
  +<src/gcode/control/M108_*.cpp>
  +<src/gcode/control/M111.cpp>
  +<src/gcode/control/M120_M121.cpp>
  +<src/gcode/control/M999.cpp>
  +<src/gcode/geometry/G92.cpp>
  +<src/gcode/host/M110.cpp>
  +<src/gcode/host/M114.cpp>
  +<src/gcode/host/M118.cpp>
  +<src/gcode/host/M119.cpp>
  +<src/gcode/motion/G0_G1.cpp>
  +<src/gcode/motion/G4.cpp>
  +<src/gcode/motion/M400.cpp>
  +<src/gcode/temp/M105.cpp>
  +<src/module/endstops.cpp>
  +<src/module/motion.cpp>
  +<src/module/planner.cpp>
  +<src/module/settings.cpp>
  +<src/module/stepper.cpp>
  +<src/module/temperature.cpp>
  +<src/module/tool_change.cpp>
  +<src/module/stepper/indirection.cpp>

#
# Default values apply to all 'env:' prefixed environments
#
[env]
framework        = arduino
extra_scripts    = ${common.extra_scripts}
build_flags      = ${common.build_flags}
lib_deps         = ${common.lib_deps}
monitor_speed    = 250000
monitor_eol      = LF
monitor_echo     = yes
monitor_filters  = colorize, time, send_on_enter



#################################
#                               #
#   Unique Core Architectures   #
#                               #
#  Add a new "env" below if no  #
# entry has values suitable to  #
#   build for a given board.    #
#                               #
#################################



[TAZ_BASE]
platform                 = atmelsam
build_src_filter         = ${common.default_src_filter} +<src/HAL/DUE> +<src/HAL/shared/backtrace>
board                    = marlin_archim
board_build.variants_dir = buildroot/share/PlatformIO/variants/
build_flags              = ${common.build_flags}
  -DARDUINO_SAM_ARCHIM -DARDUINO_ARCH_SAM -D__SAM3X8E__ -DUSBCON
extra_scripts            = ${common.extra_scripts}
  Marlin/src/HAL/DUE/upload_extra_script.py

#
# TAZ 8 and TAZ 8 XT
#

[env:TAZ8_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZ8 -DTOOLHEAD_Galaxy_Series

[env:TAZ8_Galaxy_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZ8 -DTOOLHEAD_Galaxy_DualExtruder

[env:TAZ8_LongBed_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZ8 -DLULZBOT_LONG_BED_V2 -DTOOLHEAD_Galaxy_Series

[env:TAZ8_LongBed_Galaxy_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZ8 -DLULZBOT_LONG_BED_V2 -DTOOLHEAD_Galaxy_DualExtruder

[env:TAZ8XT_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
   -DTAZ8XT -DTOOLHEAD_Galaxy_Series

[env:TAZ8XT_Galaxy_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
   -DTAZ8XT -DTOOLHEAD_Galaxy_DualExtruder

[env:TAZ8XT_LongBed_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
   -DTAZ8XT -DLULZBOT_LONG_BED_V2 -DTOOLHEAD_Galaxy_Series

[env:TAZ8XT_LongBed_Galaxy_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
   -DTAZ8XT -DLULZBOT_LONG_BED_V2 -DTOOLHEAD_Galaxy_DualExtruder


#
# TAZ Pro and TAZ Pro XT
#

[env:TAZPro_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DTOOLHEAD_Galaxy_Series

[env:TAZPro_Galaxy_BLTouch]
