  -DTAZProXT -DLULZBOT_BLTouch -DLULZBOT_LONG_BED_V2 -DTOOLHEAD_Galaxy_Series



##########################################
# 8-bit AVR Architectures
##########################################

[common_avr8]
platform          = atmelavr
build_flags       = ${common.build_flags} -std=gnu++1z -Wl,--relax
build_unflags     = -std=gnu++11
board_build.f_cpu = 16000000L
build_src_filter  = ${common.default_src_filter} +<src/HAL/AVR>
board             = megaatmega2560

#
# Lulzbot Mini 2
#
[env:Mini2_Galaxy]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DMiniV2 -DTOOLHEAD_Galaxy_Series

[env:Mini2_Universal]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DMiniV2 -DTOOLHEAD_Legacy_Universal


#
# LulzBot SideKick 289
#
[env:SideKick289_Galaxy]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DSideKick_289 -DTOOLHEAD_Galaxy_Series

[env:SideKick289_Universal]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DSideKick_289 -DTOOLHEAD_Legacy_Universal


#
# LulzBot SideKick 747
#
[env:SideKick747_Galaxy]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DSideKick_747 -DTOOLHEAD_Galaxy_Series

[env:SideKick747_Universal]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DSideKick_747 -DTOOLHEAD_Legacy_Universal


#
# Workhorse
#
[env:Workhorse_Galaxy]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags}
  -DWorkhorse -DTOOLHEAD_Galaxy_Series

[env:Workhorse_Universal]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags} -DWorkhorse
  -DTOOLHEAD_Legacy_Universal


#
# Workhorse 2
#
[env:Workhorse2_Galaxy]
extends       = common_avr8
build_flags   = ${common_avr8.build_flags} 
  -DWorkhorse2 -DTOOLHEAD_Galaxy_Series
