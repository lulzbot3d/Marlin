build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DTOOLHEAD_Galaxy_Series -DLULZBOT_BLTouch 

[env:TAZPro_Galaxy_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DTOOLHEAD_Galaxy_DualExtruder

[env:TAZPro_Universal]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DTOOLHEAD_Legacy_Universal

[env:TAZPro_Universal_BLTouch]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DTOOLHEAD_Legacy_Universal -DLULZBOT_BLTouch

[env:TAZPro_Universal_Dual]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DTOOLHEAD_Universal_DualExtruder

[env:TAZPro_LongBed_Galaxy]
extends                  = TAZ_BASE
build_flags              = ${TAZ_BASE.build_flags}
  -DTAZPro -DLULZBOT_BLTouch -DLULZBOT_LONG_BED -DTOOLHEAD_Galaxy_Series

